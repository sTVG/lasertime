<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>Space Hopper</title>
  <style>
    body { margin:0; background:#000; color:#fff; font-family:sans-serif; text-align:center; }
    canvas { background:#000; display:block; margin:0 auto; border:1px solid #444; }
    #scoreboard { margin-top:10px; }
    #dev { position:fixed; bottom:0; left:0; background:rgba(0,0,0,0.7); color:#0f0; padding:5px; font-size:12px; }
  </style>
</head>
<body>
  <canvas id="game" width="320" height="480"></canvas>
  <div id="scoreboard">Score: <span id="score">0</span></div>
  <div id="leaderboard"></div>
  <div id="dev"></div>
  <audio id="bgm" loop>
    <source src="space.mp3" type="audio/mpeg">
  </audio>
  <script src="app.js"></script>
</body>
</html>
